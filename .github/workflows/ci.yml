name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/node/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extensions/node/server/package-lock.json
      - run: npm ci
      - name: Bundled server is up to date
        run: npm run check-bundle
      - run: npm test

  extensions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --release --target wasm32-wasip2 -p zed-parquet-viewer -p zed-parquet-viewer-native -- -D warnings
      - run: cargo build --release --target wasm32-wasip2 -p zed-parquet-viewer -p zed-parquet-viewer-native

  native-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy -p parquet-viewer-mcp -- -D warnings
      - run: cargo test -p parquet-viewer-mcp
