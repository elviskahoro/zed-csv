[package]
name = "parquet-viewer-mcp"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "Native MCP server that lets Zed's agent inspect and convert Parquet files"

[dependencies]
parquet = { version = "60.1.0", default-features = false, features = ["snap", "zstd", "lz4", "flate2-rust_backend", "json"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
